name: Build full Markdown export

# Regenerates the derived files on every push to main:
#   - eo-wiki.md         (the full, unabridged wiki as one file, for
#                         https://experientialontology.org/eo-wiki.md)
#   - site/recent.json   (git-aware last-updated data for the front page's
#                         "Most recent updates" section)
# The n8n publish webhook commits changes to main, which triggers this; the
# regenerated commit only touches the two derived files, which are ignored by
# the paths filter, so it does not retrigger itself.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'eo-wiki.md'
      - 'site/recent.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-full-md
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build-recent.js needs full history for per-file dates

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build eo-wiki.md
        run: node tools/build-full-md.js eo-wiki.md

      - name: Build site/recent.json
        run: node tools/build-recent.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- eo-wiki.md site/recent.json; then
            echo "Derived files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eo-wiki.md site/recent.json
          git commit -m "chore: rebuild derived files (eo-wiki.md, site/recent.json)"
          git push
